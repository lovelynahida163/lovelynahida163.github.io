title: Life of Nahida
description: 随意写写
author: Nahida
email: lovelynahida163@gmail.com  

remote_theme: bencentra/centrarium
plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-seo-tag

header_pages:
  - about.md
  # 如果需要归档页或分类页，可以继续加：
  # - archives.md
  # - categories.md

# Centrarium 特定配置（可选，用于个性化）
# 具体请参考主题文档：https://github.com/bencentra/centrarium

# 默认布局
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: false   # 评论可后期用 Giscus

# 文章链接格式（可选）
permalink: /:year/:month/:day/:title/

# 显示文章摘要（在首页）
show_excerpts: true

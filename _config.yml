# -------------------------
# Site settings 站点基础信息
# -------------------------
title: 'Life of Nahida'
description: 'Seize the day!'
keyword: 'Nahida, blog' 
url: 'https://lovelynahida163.github.io'
baseurl: ''

# -------------------------
# Theme 核心主题加载
# -------------------------
remote_theme: kaeyleo/jekyll-theme-H2O
theme-color: 'pink'

# -------------------------
# Author & Sidebar 作者与侧边栏设置
# -------------------------
author: 'Nahida'
avatar: '/assets/img/1470e3fa01e7dfa1ac101fcc2223e970.jpg'
bio: '随意写写 / Record my life'

sns:
  github: https://github.com/lovelynahida163
  email: mailto:lovelynahida163@gmail.com

recommend-tags: true
recommend-condition-size: 10
search: true

# -------------------------
# Build & Pagination 构建与分页逻辑
# -------------------------
paginate: 6
paginate_path: 'page:num'

plugins:
  - jekyll-remote-theme
  - jekyll-paginate
  - jekyll-feed
  - jekyll-seo-tag

permalink: /:year/:month/:day/:title.html

# -------------------------
# Comments 评论系统
# -------------------------
comments: false

future: true
timezone: Asia/Shanghai

# -------------------------
# Markdown + 数学公式 最终修正版（无重复、全生效）
# -------------------------
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  math_engine: mathjax
  parse_block_html: true
  inline_math_delimiters: [["$", "$"]]
  display_math_delimiters: [["$$", "$$"]]

# 全局公式渲染脚本
mathjax: true
page_head: |
  <script id="MathJax-script" async
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
  </script>
  <script>
  MathJax = {
    tex: {
      inlineMath: [['$', '$']],
      displayMath: [['$$', '$$']],
      processEscapes: true
    }
  };
  </script>


# -------------------------
# Site settings 站点基础信息
# -------------------------
title: 'Life of Nahida'
description: 'Seize the day!'
keyword: 'Nahida, blog' 
url: 'https://lovelynahida163.github.io'
baseurl: ''

# -------------------------
# Theme 核心主题加载
# -------------------------
remote_theme: kaeyleo/jekyll-theme-H2O
theme-color: 'pink'

# -------------------------
# Author & Sidebar 作者与侧边栏设置
# -------------------------
author: 'Nahida'
avatar: '/assets/img/1470e3fa01e7dfa1ac101fcc2223e970.jpg'
bio: '随意写写 / Record my life'

sns:
  github: https://github.com/lovelynahida163
  email: mailto:lovelynahida163@gmail.com

recommend-tags: true
recommend-condition-size: 10
search: true

# -------------------------
# Build & Pagination 构建与分页逻辑
# -------------------------
paginate: 6
paginate_path: 'page:num'

plugins:
  - jekyll-remote-theme
  - jekyll-paginate
  - jekyll-feed
  - jekyll-seo-tag

permalink: /year/month/day/title.html

# -------------------------
# Comments 评论系统
# -------------------------
comments: false

future: true
timezone: Asia/Shanghai

# -------------------------
# ✅ 纯YML公式自动渲染（唯一修改点，全站自动生效）
# -------------------------
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  math_engine: katex
  parse_block_html: true

# 全局自动注入KaTeX渲染引擎（H2O主题原生支持）
head_custom: |
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <script>
  document.addEventListener("DOMContentLoaded",function(){renderMathInElement(document.body,{delimiters:[{left:"$",right:"$",display:!1},{left:"$$",right:"$$",display:!0}],trust:!0,strict:"ignore",throwOnError:!1})});
  </script>


